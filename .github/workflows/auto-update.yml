name: Auto-update OpenAPI Spec

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-update:
    name: Auto-update OpenAPI Spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenAPI Generator CLI
        run: npm install -g @openapitools/openapi-generator-cli

      - name: Auto-update OpenAPI spec
        env:
          PUBLISHER_URL: ${{ vars.PUBLISHER_URL }}
          KHULNASOFT_API_KEY: ${{ secrets.KHULNASOFT_API_KEY }}
        run: |
          python3 scripts/update_spec.py

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "No changes detected. Spec is already up to date."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected. Committing and pushing..."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload updated SDK artifact
        if: steps.check-changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: typescript-sdk
          path: generated_sdks/typescript/
          retention-days: 7

      - name: Commit and push changes
        if: steps.check-changes.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openapi.yaml
          git commit -m "feat: auto-update openapi.yaml from publisher"
          git push

      - name: Create PR for changes
        if: steps.check-changes.outputs.changed == 'true' && github.event_name == 'schedule'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-update/openapi-spec
          title: "feat: auto-update openapi.yaml"
          body: |
            OpenAPI specification has been automatically updated from the publisher service.
            
            - Updated `openapi.yaml` from publisher
            
            Please review and merge to update the spec.
          commit-message: "feat: auto-update openapi.yaml from publisher"
          labels: |
            auto-update
            dependencies
          draft: false
